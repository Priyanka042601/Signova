<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Signova — Learn Indian Sign Language (ISL) through bite-sized, gamified visual lessons, interactive quizzes, and everyday conversation practice." />
    <meta name="theme-color" content="#2563EB" />
    <meta name="color-scheme" content="light dark" />
    <title>Signova — A New Way to Connect | Indian Sign Language Learning</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('signova_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-cloud dark:bg-[#0B0F19] text-navy-brand dark:text-slate-100 min-h-screen selection:bg-blue-100 dark:selection:bg-blue-900 selection:text-blue-900 dark:selection:text-blue-100 transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
